version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taxflow-postgres
    environment:
      POSTGRES_USER: taxflow
      POSTGRES_PASSWORD: taxflow_dev
      POSTGRES_DB: taxflow
    ports:
      - '5432:5432'
    volumes:
      - taxflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taxflow -d taxflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taxflow_pg_data:
